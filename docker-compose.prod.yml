# Production-style compose using a prebuilt image (see scripts/build-image.sh).
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# First load the image on this host, e.g.:
#   LOAD_HOST=root@nas ./scripts/build-image.sh guitar-tracker:prod

services:
  guitar-tracker:
    image: guitar-tracker:prod
    restart: unless-stopped
    ports:
      - "3131:3131"
    environment:
      - DATABASE_URL=file:/data/guitar-tracker.db
      - PHOTOS_DIR=/data/photos
      - PORT=3131
      # Public URL used in password-reset emails. Change this to the URL you
      # actually open (LAN IP or HTTPS hostname behind a reverse proxy).
      - APP_PUBLIC_ORIGIN=http://localhost:3131
    # Host ./data is created automatically on first `compose up` if missing.
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3131/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
